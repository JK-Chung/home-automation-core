# Home Assistant, reachable from the internet through an ngrok tunnel.
# Credentials come from .env next to this file (see .env.example).
# Image tags pin a *major* version: patch/minor updates arrive automatically
# (host/systemd/container-autoupdate.*); bump a major by editing the tag.

# ngrok's fixed IP: used for its network address AND passed to Home Assistant,
# which trusts it as a reverse proxy (homeassistant/trust-ngrok-proxy.py).
x-ngrok-ip: &ngrok_ip 172.19.0.5

services:
  ngrok:
    image: ngrok/ngrok:3                 # major: semver (3.x.y)
    container_name: ngrok
    command: ["http", "http://homeassistant:8123", "--log=stdout"]
    ports:
      - 4040:4040                        # ngrok inspector (shows the public URL)
    restart: always
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    networks:
      ngrok:
        ipv4_address: *ngrok_ip
    depends_on:
      homeassistant:
        condition: service_healthy

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11   # major: monthly release (YYYY.M)
    container_name: homeassistant
    privileged: true
    restart: always
    # Trust ngrok as a reverse proxy before HA starts. If that fails, the
    # container exits (restart: always retries) - see `docker logs homeassistant`.
    entrypoint:
      - /bin/sh
      - -c
      - python3 -I /usr/local/bin/trust-ngrok-proxy.py && exec /init
    environment:
      NGROK_PROXY_IP: *ngrok_ip
    ports:
      - 8123:8123
    networks:
      - ngrok
    volumes:
      # Relative paths resolve against this file's directory.
      - ./data/homeassistant:/config     # HA config + database (not in git)
      - ./homeassistant/trust-ngrok-proxy.py:/usr/local/bin/trust-ngrok-proxy.py:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro           # Bluetooth
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  ngrok:
    name: ngrok
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
